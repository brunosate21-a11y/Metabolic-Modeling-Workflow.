sample_sheet: ".test/config/samples.tsv"

get_genome:
  ncbi_ftp: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/146/045/GCF_000146045.2_R64/GCF_000146045.2_R64_genomic.fna.gz

simulate_reads:
  read_length: 100
  read_number: 10000

MAGS:
  - Ecoli_K12_MG1655

solver: scip
media: M9

quality_filters:
  checkm:
    min_completeness: 50.0
    max_contamination: 10.0
  memote:
    min_total_score: 0.4